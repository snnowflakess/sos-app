<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile</title>

<script>
(function(){
  const savedTheme = localStorage.getItem("theme") || "dark";
  if(savedTheme === "light"){
    document.documentElement.classList.add("light-preload");
  }
})();
</script>

<link rel="stylesheet" href="style.css" />

<style>
.profile-page{
padding:20px;
padding-bottom:110px;
background:var(--bg-main);
min-height:100vh;
transition:background-color .4s ease,color .4s ease;
}

.profile-card{
background:linear-gradient(145deg,var(--card-bg),var(--card-bg));
border-radius:24px;
padding:28px 20px 22px;
text-align:center;
box-shadow:var(--shadow-soft);
margin-bottom:20px;
border:1px solid var(--border-soft);
transition:background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease;
}

.avatar-upload{
width:96px;
height:96px;
border-radius:50%;
background:linear-gradient(145deg,#ff4b4b,#d60000);
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 14px;
overflow:hidden;
cursor:pointer;
box-shadow:0 0 24px rgba(255,59,59,0.28);
position:relative;
}

.avatar-upload img{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

#avatarIcon{
font-size:42px;
color:white;
}

.avatar-edit-text{
font-size:12px;
color:var(--text-soft);
margin-top:-4px;
margin-bottom:10px;
transition:color .4s ease;
}

.profile-name{
font-size:24px;
font-weight:700;
margin-bottom:6px;
color:var(--text-main);
transition:color .4s ease;
}

.profile-location{
font-size:14px;
color:var(--text-soft);
margin-bottom:14px;
transition:color .4s ease;
}

.edit-btn{
border:none;
background:linear-gradient(145deg,#2f80ff,#1a5ed8);
color:white;
padding:10px 18px;
border-radius:999px;
font-size:14px;
cursor:pointer;
box-shadow:0 10px 20px rgba(41,121,255,0.25);
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

.stat-card{
background:var(--card-bg);
border-radius:18px;
padding:16px 10px;
text-align:center;
box-shadow:var(--shadow-soft);
border:1px solid var(--border-soft);
transition:background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease;
}

.stat-number{
font-size:20px;
font-weight:700;
color:var(--text-main);
transition:color .4s ease;
}

.stat-label{
font-size:12px;
color:var(--text-soft);
transition:color .4s ease;
}

.section-title{
font-size:16px;
font-weight:700;
margin-bottom:12px;
margin-top:8px;
color:var(--text-main);
transition:color .4s ease;
}

.info-list{
display:flex;
flex-direction:column;
gap:12px;
}

.info-card{
background:var(--card-bg);
border-radius:18px;
padding:15px 16px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:var(--shadow-soft);
border:1px solid var(--border-soft);
gap:16px;
cursor:pointer;
transition:background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease;
}

.info-left{
display:flex;
flex-direction:column;
gap:4px;
}

.info-title{
font-size:14px;
color:var(--text-main);
font-weight:600;
transition:color .4s ease;
}

.info-sub{
font-size:13px;
color:var(--text-soft);
word-break:break-word;
transition:color .4s ease;
}

.toast{
position:fixed;
left:50%;
bottom:110px;
transform:translateX(-50%) translateY(20px);
background:rgba(0,200,83,0.95);
color:white;
padding:12px 18px;
border-radius:999px;
font-size:14px;
opacity:0;
pointer-events:none;
transition:.3s ease;
z-index:30;
box-shadow:0 8px 20px rgba(0,0,0,0.35);
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

.modal-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
opacity:0;
pointer-events:none;
transition:.3s ease;
z-index:40;
}

.modal-overlay.show{
opacity:1;
pointer-events:auto;
}

.edit-modal{
position:fixed;
left:0;
right:0;
bottom:0;
background:var(--card-bg);
border-top-left-radius:24px;
border-top-right-radius:24px;
padding:18px 18px 24px;
transform:translateY(100%);
transition:.35s ease, background-color .4s ease, color .4s ease;
z-index:50;
box-shadow:0 -10px 30px rgba(0,0,0,0.45);
max-height:88vh;
overflow-y:auto;
border-top:1px solid var(--border-soft);
}

.edit-modal.show{
transform:translateY(0);
}

.drag-line{
width:54px;
height:5px;
border-radius:999px;
background:#4c4c4c;
margin:0 auto 16px;
}

.modal-title{
font-size:20px;
font-weight:700;
margin-bottom:16px;
text-align:center;
color:var(--text-main);
transition:color .4s ease;
}

.form-group{
margin-bottom:14px;
}

.form-label{
display:block;
font-size:13px;
color:var(--text-soft);
margin-bottom:7px;
transition:color .4s ease;
}

.form-input{
width:100%;
padding:13px 14px;
border-radius:14px;
border:1px solid var(--border-soft);
background:var(--input-bg);
color:var(--text-main);
font-size:14px;
outline:none;
transition:background-color .4s ease,color .4s ease,border-color .4s ease;
}

.form-input:focus{
border-color:#2f80ff;
box-shadow:0 0 0 3px rgba(47,128,255,0.14);
}

.modal-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:10px;
}

.cancel-btn,
.save-btn{
border:none;
padding:14px;
border-radius:14px;
font-size:15px;
font-weight:600;
cursor:pointer;
}

.cancel-btn{
background:var(--button-bg);
color:var(--text-main);
transition:background-color .4s ease,color .4s ease;
}

.save-btn{
background:linear-gradient(145deg,#ff4b4b,#d60000);
color:white;
box-shadow:0 10px 20px rgba(255,59,59,0.22);
}

@media (max-width:768px){
.stats{
grid-template-columns:repeat(3,1fr);
}
}
</style>
</head>

<body>
<div class="app">
<header class="header">
  <h2>👤 My Profile</h2>
</header>

<div class="profile-page">
  <div class="profile-card">
    <div class="avatar-upload" onclick="triggerImageUpload()">
      <img id="profileImage" alt="Profile Photo">
      <span id="avatarIcon">👤</span>
    </div>

    <input type="file" id="profileImageInput" accept="image/*" style="display:none;">

    <div class="avatar-edit-text">Tap photo to upload</div>

    <div class="profile-name" id="profileName">User Name</div>
    <div class="profile-location" id="profileLocation">📍 Detecting location...</div>
    <button class="edit-btn" onclick="openEditModal()">Edit Profile</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-number">12</div>
      <div class="stat-label">SOS Sent</div>
    </div>
    <div class="stat-card">
      <div class="stat-number">5</div>
      <div class="stat-label">People Helped</div>
    </div>
    <div class="stat-card">
      <div class="stat-number">3</div>
      <div class="stat-label">Alerts Nearby</div>
    </div>
  </div>

  <div class="section-title">Personal Info</div>

  <div class="info-list">
    <div class="info-card" onclick="openEditModal()">
      <div class="info-left">
        <div class="info-title">📞 Phone</div>
        <div class="info-sub" id="profilePhone">Not added</div>
      </div>
    </div>

    <div class="info-card" onclick="openEditModal()">
      <div class="info-left">
        <div class="info-title">✉️ Email</div>
        <div class="info-sub" id="profileEmail">Not added</div>
      </div>
    </div>

    <div class="info-card" onclick="openEditModal()">
      <div class="info-left">
        <div class="info-title">🆘 Emergency Contact</div>
        <div class="info-sub" id="profileEmergency">Not added</div>
      </div>
    </div>

    <div class="info-card" onclick="openEditModal()">
      <div class="info-left">
        <div class="info-title">🏙 City / Area</div>
        <div class="info-sub" id="profileCity">Not added</div>
      </div>
    </div>

    <div class="info-card" onclick="openEditModal()">
      <div class="info-left">
        <div class="info-title">🩸 Blood Group</div>
        <div class="info-sub" id="profileBlood">Not added</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Profile updated successfully</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeEditModal()"></div>

<div class="edit-modal" id="editModal">
  <div class="drag-line"></div>
  <div class="modal-title">Edit Profile</div>

  <div class="form-group">
    <label class="form-label">Full Name</label>
    <input type="text" class="form-input" id="editName" placeholder="Enter full name">
  </div>

  <div class="form-group">
    <label class="form-label">Phone Number</label>
    <input type="tel" class="form-input" id="editPhone" placeholder="Enter phone number">
  </div>

  <div class="form-group">
    <label class="form-label">Email</label>
    <input type="email" class="form-input" id="editEmail" placeholder="Enter email">
  </div>

  <div class="form-group">
    <label class="form-label">Emergency Contact</label>
    <input type="tel" class="form-input" id="editEmergency" placeholder="Enter emergency contact">
  </div>

  <div class="form-group">
    <label class="form-label">City / Area</label>
    <input type="text" class="form-input" id="editCity" placeholder="Enter city or area">
  </div>

  <div class="form-group">
    <label class="form-label">Blood Group</label>
    <input type="text" class="form-input" id="editBlood" placeholder="Enter blood group">
  </div>

  <div class="modal-actions">
    <button class="cancel-btn" onclick="closeEditModal()">Cancel</button>
    <button class="save-btn" onclick="saveProfile()">Save Changes</button>
  </div>
</div>

<div class="fan-container" id="fanMenu">
  <button class="fan-item profile" onclick="goProfile()">👤</button>
  <button class="fan-item settings" onclick="goSettings()">⚙️</button>
</div>

<footer class="footer">
  <button onclick="goHome()">🏠</button>
  <button onclick="goVolunteers()">🤝</button>
  <button id="menuButton">☰</button>
</footer>
</div>

<script>
function applySavedTheme(){
  const savedTheme = localStorage.getItem("theme") || "dark";
  if(savedTheme === "light"){
    document.body.classList.add("light-mode");
  }else{
    document.body.classList.remove("light-mode");
  }
}

applySavedTheme();

function getStoredUser(){
  const existing = JSON.parse(localStorage.getItem("user"));
  if(existing) return existing;

  const fallbackUser = {
    name:"User Name",
    phone:"",
    email:"",
    emergencyContact:"",
    city:"",
    bloodGroup:""
  };

  localStorage.setItem("user", JSON.stringify(fallbackUser));
  return fallbackUser;
}

let user = getStoredUser();

const profileImageInput = document.getElementById("profileImageInput");
const profileImage = document.getElementById("profileImage");
const avatarIcon = document.getElementById("avatarIcon");

function loadProfilePhoto(){
  const savedPhoto = localStorage.getItem("profilePhoto");

  if(savedPhoto){
    profileImage.src = savedPhoto;
    profileImage.style.display = "block";
    avatarIcon.style.display = "none";
  }else{
    profileImage.style.display = "none";
    avatarIcon.style.display = "block";
  }
}

function triggerImageUpload(){
  profileImageInput.click();
}

profileImageInput.addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    const imageData = e.target.result;
    profileImage.src = imageData;
    profileImage.style.display = "block";
    avatarIcon.style.display = "none";
    localStorage.setItem("profilePhoto", imageData);
    showToast("Profile photo updated");
  };

  reader.readAsDataURL(file);
});

function renderProfile(){
  document.getElementById("profileName").innerText = user.name || "User Name";
  document.getElementById("profilePhone").innerText = user.phone || "Not added";
  document.getElementById("profileEmail").innerText = user.email || "Not added";
  document.getElementById("profileEmergency").innerText = user.emergencyContact || "Not added";
  document.getElementById("profileCity").innerText = user.city || "Not added";
  document.getElementById("profileBlood").innerText = user.bloodGroup || "Not added";
}

function openEditModal(){
  document.getElementById("editName").value = user.name || "";
  document.getElementById("editPhone").value = user.phone || "";
  document.getElementById("editEmail").value = user.email || "";
  document.getElementById("editEmergency").value = user.emergencyContact || "";
  document.getElementById("editCity").value = user.city || "";
  document.getElementById("editBlood").value = user.bloodGroup || "";

  document.getElementById("modalOverlay").classList.add("show");
  document.getElementById("editModal").classList.add("show");
}

function closeEditModal(){
  document.getElementById("modalOverlay").classList.remove("show");
  document.getElementById("editModal").classList.remove("show");
}

function showToast(message){
  const toast = document.getElementById("toast");
  toast.innerText = message;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2200);
}

function saveProfile(){
  user.name = document.getElementById("editName").value.trim();
  user.phone = document.getElementById("editPhone").value.trim();
  user.email = document.getElementById("editEmail").value.trim();
  user.emergencyContact = document.getElementById("editEmergency").value.trim();
  user.city = document.getElementById("editCity").value.trim();
  user.bloodGroup = document.getElementById("editBlood").value.trim();

  if(!user.name){
    user.name = "User Name";
  }

  localStorage.setItem("user", JSON.stringify(user));
  renderProfile();
  closeEditModal();
  showToast("Profile updated successfully");
}

navigator.geolocation.getCurrentPosition(async (pos)=>{
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;

  try{
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`;
    const res = await fetch(url);
    const data = await res.json();

    const detectedPlace =
      data.address.city ||
      data.address.town ||
      data.address.village ||
      data.address.state ||
      "your area";

    document.getElementById("profileLocation").innerText = `📍 ${user.city || detectedPlace}`;
  }catch(e){
    document.getElementById("profileLocation").innerText = `📍 ${user.city || "Location unavailable"}`;
  }
},()=>{
  document.getElementById("profileLocation").innerText = `📍 ${user.city || "Location unavailable"}`;
});

function goHome(){
  window.location.href="index.html";
}

function goVolunteers(){
  window.location.href="volunteers.html";
}

function goProfile(){
  window.location.href="profile.html";
}

function goSettings(){
  window.location.href="settings.html";
}

const menuButton = document.getElementById("menuButton");
const fanMenu = document.getElementById("fanMenu");

menuButton.addEventListener("click",()=>{
  fanMenu.classList.toggle("active");
});

renderProfile();
loadProfilePhoto();
</script>
</body>
</html>
