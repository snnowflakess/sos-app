<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SOS Connect</title>
<link rel="stylesheet" href="style.css">

<style>
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:var(--bg-main);
}

.login-container{
width:min(92%,360px);
background:var(--card-bg);
padding:24px 20px;
border-radius:24px;
box-shadow:var(--shadow-soft);
border:1px solid var(--border-soft);
text-align:center;
}

.login-container h1{
font-size:28px;
margin-bottom:8px;
color:var(--text-main);
}

.login-container p{
font-size:14px;
color:var(--text-soft);
margin-bottom:18px;
}

.login-container input{
width:100%;
padding:13px 14px;
margin-bottom:12px;
border:none;
border-radius:14px;
background:var(--input-bg);
color:var(--text-main);
font-size:14px;
outline:none;
border:1px solid var(--border-soft);
}

.login-container button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(145deg,#ff4b4b,#d60000);
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.error-text{
margin-top:10px;
font-size:13px;
color:#ff5c5c;
min-height:18px;
}
.tagline{
font-size:14px;
color:var(--text-soft);
margin-top:-4px;
margin-bottom:10px;
text-align:center;
}
</style>
</head>
<body>

<div class="login-container">
    <h1>SOS Connect</h1>
    <p class="tagline">Because every second counts...</p>
    <h2>Login / Register</h2>

  <input type="text" id="name" placeholder="Full Name">
  <input type="email" id="email" placeholder="Email Address">
  <input type="tel" id="phone" placeholder="Phone Number">

  <button onclick="saveUser()">Enter App</button>
  <div class="error-text" id="errorText"></div>
</div>

<script>
const existingUser = localStorage.getItem("user");
if(existingUser){
  window.location.href = "index.html";
}

function saveUser(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const errorText = document.getElementById("errorText");

  if(!name || !email || !phone){
    errorText.innerText = "Please fill all fields";
    return;
  }

  if(!email.includes("@")){
    errorText.innerText = "Enter a valid email";
    return;
  }

  if(phone.length < 10){
    errorText.innerText = "Enter a valid phone number";
    return;
  }

  const user = {
    name,
    email,
    phone
  };

  localStorage.setItem("user", JSON.stringify(user));
  window.location.href = "index.html";
}
</script>

</body>
</html>
